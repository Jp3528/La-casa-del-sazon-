<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador de Ubicación de Repartidor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #f0f2f5; 
            font-family: 'Poppins', sans-serif; 
            padding-top: 40px;
            color: #333;
        }
        .container-fluid {
            padding: 0 30px;
        }
        .card {
            border: none;
            border-radius: 1.25rem; 
            box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .card-header {
            background-color: #6f42c1; 
            color: white;
            padding: 1.5rem 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-header i {
            margin-right: 15px;
            font-size: 1.8rem;
        }
        .card-body {
            padding: 2rem;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        .form-control, .form-select {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            border: 1px solid #ced4da;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.25rem rgba(0, 123, 255, 0.25);
        }
        .btn {
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
            border-color: #218838;
            transform: translateY(-2px);
        }
        .btn-info {
            background-color: #17a2b8;
            border-color: #17a2b8;
        }
        .btn-info:hover {
            background-color: #138496;
            border-color: #138496;
            transform: translateY(-2px);
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #e0a800;
            transform: translateY(-2px);
        }
        pre {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 0.75rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ced4da;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            color: #333;
        }
        .text-gradient {
            background: linear-gradient(to right, #6f42c1, #007bff);
            -webkit-background-clip: text;
            background-clip: text; 
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">
                <h1 class="text-center mb-5 mt-4 text-gradient">Panel de Simulación de Ubicación de Repartidores</h1>
                
                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-primary text-white">
                                <i class="fas fa-pencil-alt"></i> Envío Manual de Ubicación
                            </div>
                            <div class="card-body">
                                <p class="text-muted mb-4">Establece la latitud y longitud exactas para un repartidor.</p>
                                <form id="manualLocationForm">
                                    <div class="mb-3">
                                        <label for="repartidor_id_manual" class="form-label">Seleccionar Repartidor:</label>
                                        <select class="form-select" id="repartidor_id_manual" name="repartidor_id" required>
                                            </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="latitud_manual" class="form-label">Latitud:</label>
                                        <input type="text" class="form-control" id="latitud_manual" name="latitud" value="-12.046374" required>
                                    </div>
                                    <div class="mb-4">
                                        <label for="longitud_manual" class="form-label">Longitud:</label>
                                        <input type="text" class="form-control" id="longitud_manual" name="longitud" value="-77.042793" required>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-location-arrow"></i> Enviar Ubicación Manual</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-header bg-success text-white">
                                <i class="fas fa-random"></i> Envío de Ubicación Aleatoria
                            </div>
                            <div class="card-body">
                                <p class="text-muted mb-4">Simula el movimiento de los repartidores enviando ubicaciones aleatorias cercanas a Lima.</p>
                                <div class="mb-3">
                                    <label for="repartidor_id_random" class="form-label">Seleccionar Repartidor para Simular:</label>
                                    <select class="form-select" id="repartidor_id_random" required>
                                        </select>
                                </div>
                                <div class="d-grid gap-2">
                                    <button id="sendRandomLocation" class="btn btn-success btn-lg mb-2"><i class="fas fa-dice"></i> Enviar Ubicación Aleatoria (Único)</button>
                                    <button id="startAutoRandom" class="btn btn-info btn-lg mb-2"><i class="fas fa-play"></i> Iniciar Auto-Envío (Cada 3 seg)</button>
                                    <button id="stopAutoRandom" class="btn btn-warning btn-lg" style="display: none;"><i class="fas fa-stop"></i> Detener Auto-Envío</button>
                                </div>
                                <div class="mt-4">
                                    <h5 class="mb-2"><i class="fas fa-terminal"></i> Consola de Respuesta:</h5>
                                    <pre id="responseOutput"></pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        let repartidores = [];

        const LIMA_CENTER = { lat: -12.046374, lng: -77.042793 }; // Coordenadas centrales de Lima
        const RANDOM_LOCATION_DELTA = 0.005; // Rango de variación para ubicaciones aleatorias (~0.55 km)
        const AUTO_SEND_DELAY = 3000; // 3 segundos para el auto-envío

        // *** ELEMENTOS DEL DOM ***
        const responseOutput = document.getElementById('responseOutput');
        const sendRandomLocationBtn = document.getElementById('sendRandomLocation');
        const startAutoRandomBtn = document.getElementById('startAutoRandom');
        const stopAutoRandomBtn = document.getElementById('stopAutoRandom');
        const repartidorIdManualSelect = document.getElementById('repartidor_id_manual');
        const repartidorIdRandomSelect = document.getElementById('repartidor_id_random');

        let autoSendInterval; // 

        async function loadRepartidores() {
            try {
                const response = await fetch('obtener_repartidores.php');
                const data = await response.json();

                if (!data.success || !Array.isArray(data.repartidores) || data.repartidores.length === 0) {
                    throw new Error(data.message || 'No hay repartidores disponibles.');
                }

                repartidores = data.repartidores;
            } catch (error) {
                responseOutput.innerText = `No se pudieron cargar los repartidores: ${error.message}`;
                sendRandomLocationBtn.disabled = true;
                startAutoRandomBtn.disabled = true;
                return;
            }

            repartidorIdManualSelect.innerHTML = '';
            repartidorIdRandomSelect.innerHTML = '';

            repartidores.forEach(repartidor => {
                const createOption = (selectElement) => {
                    const option = document.createElement('option');
                    option.value = repartidor.id;
                    option.textContent = `${repartidor.id} - ${repartidor.nombre}`;
                    selectElement.appendChild(option);
                };
                createOption(repartidorIdManualSelect);
                createOption(repartidorIdRandomSelect);
            });
            if (repartidores.length > 0) {
                repartidorIdManualSelect.value = repartidores[0].id;
                repartidorIdRandomSelect.value = repartidores[0].id;
            }
        }

        // Envía la ubicación a actualizar_ubicacion_repartidor.php
        async function sendLocation(repartidorId, lat, lon, isAutoSend = false) {
            const formData = new FormData();
            formData.append('repartidor_id', repartidorId);
            formData.append('latitud', lat);
            formData.append('longitud', lon);

            try {
                const response = await fetch('actualizar_ubicacion_repartidor.php', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                if (!isAutoSend) { 
                    responseOutput.innerText = JSON.stringify(data, null, 2);
                } else {
                    // Para auto-envío, actualiza un mensaje más conciso
                    responseOutput.innerText = `Auto-enviando para Repartidor ${repartidorId}: ${lat}, ${lon} - ${data.message || (data.success ? 'Éxito' : 'Fallo')}\n` + responseOutput.innerText.substring(0, 500); // Mantiene solo los últimos mensajes
                }
                console.log(`Respuesta del servidor para Repartidor ${repartidorId}:`, data);
                if (data.success) {
                    console.log(`Ubicación enviada para Repartidor ${repartidorId}:`, lat, lon);
                }
            } catch (error) {
                console.error(`Error al enviar la ubicación para Repartidor ${repartidorId}:`, error);
                if (!isAutoSend) {
                    responseOutput.innerText = `Error al enviar la ubicación para Repartidor ${repartidorId}. Revisa la consola para más detalles.`;
                } else {
                    responseOutput.innerText = `Error Auto-enviando para Repartidor ${repartidorId}: ${error.message}\n` + responseOutput.innerText.substring(0, 500);
                }
            }
        }

        // Genera y envía una ubicación aleatoria para un repartidor
        function sendRandomLocationForRepartidor(repartidorId, isAutoSend = false) {
            const randomLat = (LIMA_CENTER.lat + (Math.random() * 2 - 1) * RANDOM_LOCATION_DELTA).toFixed(8);
            const randomLon = (LIMA_CENTER.lng + (Math.random() * 2 - 1) * RANDOM_LOCATION_DELTA).toFixed(8);
            sendLocation(repartidorId, randomLat, randomLon, isAutoSend);
        }
        // Evento para el envío manual de ubicación
        document.getElementById('manualLocationForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Previene el envío del formulario tradicional
            const repartidorId = repartidorIdManualSelect.value;
            const lat = document.getElementById('latitud_manual').value;
            const lon = document.getElementById('longitud_manual').value;
            sendLocation(repartidorId, lat, lon);
        });

        // Evento para el envío de ubicación aleatoria individual
        sendRandomLocationBtn.addEventListener('click', function() {
            const repartidorId = repartidorIdRandomSelect.value;
            if (!repartidorId) {
                alert("Por favor, selecciona un repartidor.");
                return;
            }
            sendRandomLocationForRepartidor(repartidorId);
        });

        // Evento para iniciar el auto-envío de ubicaciones aleatorias
        startAutoRandomBtn.addEventListener('click', function() {
            if (autoSendInterval) {
                clearInterval(autoSendInterval);
            }
            startAutoRandomBtn.style.display = 'none';
            stopAutoRandomBtn.style.display = 'block';
            sendRandomLocationBtn.disabled = true;

            const sendAllRandomLocations = () => {
                repartidores.forEach(repartidor => {
                    sendRandomLocationForRepartidor(repartidor.id, true); // Pasar true para isAutoSend
                });
            };

            // Ejecuta inmediatamente y luego en el intervalo
            sendAllRandomLocations();
            autoSendInterval = setInterval(sendAllRandomLocations, AUTO_SEND_DELAY);
            responseOutput.innerText = "Auto-envío iniciado. Enviando ubicaciones para todos los repartidores...\n";
        });

        // Evento para detener el auto-envío
        stopAutoRandomBtn.addEventListener('click', function() {
            clearInterval(autoSendInterval);
            responseOutput.innerText = "Auto-envío detenido.\n" + responseOutput.innerText;
            startAutoRandomBtn.style.display = 'block';
            stopAutoRandomBtn.style.display = 'none';
            sendRandomLocationBtn.disabled = false;
        });

        // *** INICIALIZACIÓN AL CARGAR EL DOM ***
        document.addEventListener('DOMContentLoaded', () => {
            loadRepartidores();
        });
    </script>
</body>
</html>
